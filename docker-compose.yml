services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: avito_kitchen
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d avito_kitchen"]
      interval: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://kitchen:kitchen@postgres:5432/avito_kitchen?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://kitchen:kitchen@postgres:5432/avito_kitchen?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  restaurant-demo:
    build:
      context: .
      dockerfile: docker/Dockerfile.restaurant
    environment:
      KITCHEN_API_URL: http://api:8080
      RESTAURANT_TOKEN: demo-pizza-token
    depends_on:
      - api
